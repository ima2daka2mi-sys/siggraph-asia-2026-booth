<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIGGRAPH Asia 2026 Booth 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
[hidden]{display:none!important}
/* Layout: full-bleed 3D viewport, one floating control bar top-left, spec strip bottom-left */
:root{
  --bg:#1b1d22; --panel:rgba(20,22,27,.86); --line:#3a3e48; --fg:#eceef2; --muted:#9aa1ad; --accent:#3f8fe0;
  --ui:"Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.title{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:700;font-size:14px;letter-spacing:.02em}
.title small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.group{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px}
button{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--line)}
button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spec{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--muted);line-height:1.7;max-width:min(420px,calc(100% - 32px))}
.spec b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.lbl{font-family:var(--ui);font-size:11px;font-weight:700;color:#fff;background:rgba(15,17,21,.78);border:1px solid rgba(255,255,255,.18);padding:2px 7px;border-radius:3px;white-space:nowrap;pointer-events:none}
.lbl.k{background:rgba(63,143,224,.9);border-color:transparent}
.hide-labels .lbl{display:none}
/* numbered equipment pins (same numbering as the equipment sheet) */
.pin{pointer-events:auto;cursor:pointer}
.pin span{display:block;width:20px;height:20px;border-radius:50%;background:#6b3fa0;color:#fff;font:700 11px/20px var(--ui);text-align:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);transition:transform .15s,background .15s}
.pin:hover span{transform:scale(1.15)}
.pin.on span{background:var(--accent);transform:scale(1.35)}
/* wired LAN tags and the 2700 height markers */
.lan{pointer-events:auto;cursor:pointer}
.occl{visibility:hidden}
.lan span{display:block;padding:2px 6px;border-radius:3px;background:#ff9f1a;color:#1b1d22;font:800 10px/14px var(--ui);letter-spacing:.03em;border:1px solid #fff3;box-shadow:0 1px 5px rgba(0,0,0,.5);white-space:nowrap;transition:transform .15s}
.lan:hover span{transform:scale(1.1)}
.lan.on span{background:#fff;transform:scale(1.25)}
.lbl.dim{background:rgba(255,210,63,.92);color:#1b1d22;border-color:transparent}
.hide-labels .lbl.dim{display:block}
.sec{margin:10px 8px 2px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.lanrow .no{background:#ff9f1a;color:#1b1d22;font-size:9px}
/* equipment & power panel */
.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:var(--ptop,72px);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(6px)}
.panel header{padding:10px 12px 10px;border-bottom:1px solid var(--line)}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2{margin:0;font-size:13px}
.panel .x{padding:2px 8px;font-size:14px;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:10.5px;color:var(--muted)}
.sum b{display:block;font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.3}
.list{overflow:auto;flex:1;padding:4px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:4px 8px;align-items:center;width:100%;text-align:left;padding:7px 8px;border-radius:4px}
.row .no{width:20px;height:20px;border-radius:50%;background:#6b3fa0;color:#fff;font-size:10.5px;font-weight:700;line-height:20px;text-align:center}
.row .nm{font-size:12px;line-height:1.35}
.row .nm em{font-style:normal;color:var(--muted);font-size:11px}
.row .pw{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .bar2{grid-column:2/4;height:3px;background:#2b2f38;border-radius:2px;overflow:hidden}
.row .bar2 i{display:block;height:100%;background:var(--accent)}
.row.on{background:rgba(63,143,224,.16);border-color:rgba(63,143,224,.6)}
.row.on .no{background:var(--accent)}
.detail{grid-column:2/4;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:4px;font-size:11px;color:var(--muted);line-height:1.55}
.detail b{color:var(--fg);font-weight:400;font-variant-numeric:tabular-nums}
.panel footer{padding:8px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.6}
.panel footer p{margin:0 0 3px}
@media (max-width:700px){
  .panel{top:auto!important;height:50vh;left:max(16px,env(safe-area-inset-left,0px));width:auto}
  body.panel-open .spec{display:none}
}
</style>
</head>
<body>

<div id="stage"></div>
<div class="bar">
  <div class="title"><span data-en="SIGGRAPH Asia 2026 · FORUM8 Booth" data-ja="SIGGRAPH Asia 2026 FORUM8 ブース">SIGGRAPH Asia 2026 · FORUM8 Booth</span><small data-en="Island 6000×6000 / based on floor plan rev. 8" data-ja="アイランド 6000×6000 ／ 平面図-8 準拠">Island 6000×6000 / based on floor plan rev. 8</small></div>

    <button id="t-label" aria-pressed="true" data-en="Labels" data-ja="ラベル">Labels</button>
    <button id="t-rot" aria-pressed="false" data-en="Auto-rotate" data-ja="自動回転">Auto-rotate</button>

<div class="spec">
  <span id="sign-desc" hidden></span>
  <span data-en="Walls 2700 · stands 1000 (tentative). Drag to orbit, scroll / pinch to zoom. Click a number for details." data-ja="壁・造作 2700・展示台 1000（仮）。ドラッグで回転、ホイール／ピンチで拡大。番号をクリックで詳細。">Walls 2700 · stands 1000 (tentative). Drag to orbit, scroll / pinch to zoom. Click a number for details.</span>
</div>
<aside class="panel" id="panel" aria-labelledby="eq-h">
  <header>
    <div class="hd"><h2 id="eq-h" data-en="Equipment & power" data-ja="出展機材・電力">Equipment &amp; power</h2><button class="x" id="eq-x" aria-label="Close">×</button></div>
    <div class="sum">
      <div><b id="sum-w"></b><span data-en="Total power" data-ja="合計電力">Total power</span></div>
      <div><b id="sum-a"></b><span data-en="at 230 V" data-ja="230V換算">at 230 V</span></div>
      <div><b>22</b><span data-en="Outlets" data-ja="口数">Outlets</span></div>
    </div>
  </header>
  <div class="list" id="eq-list"></div>
  <footer>
    <p data-en="Extension cords and power strips are not permitted: each location needs its own outlets (guide: one outlet per device)." data-ja="延長コード・テーブルタップ使用不可：設置位置ごとに口数が必要（口数は1機材1口の目安）。"></p>
    <p data-en="Power figures are catalog estimates; final values will be updated once equipment is confirmed." data-ja="電力はカタログ値の目安。最終値は機材確定後に更新。"></p>
    <p data-en="Source: Exhibition equipment spec list (30 Oct 2026, draft)" data-ja="出典：出展機材 仕様一覧（2026/10/30 簡潔版・仮）"></p>
  </footer>
</aside>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

try{ await document.fonts.load('900 40px "Noto Sans JP"'); await document.fonts.load('700 20px "Noto Sans JP"'); }catch(e){}

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement);
const labelR=new CSS2DRenderer(); labelR.domElement.style.position='absolute'; labelR.domElement.style.inset='0'; labelR.domElement.style.pointerEvents='none';
stage.appendChild(labelR.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a2d33);
scene.fog=new THREE.Fog(0x2a2d33,18,40);
const camera=new THREE.PerspectiveCamera(42,1,0.05,100);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=2; controls.maxDistance=28;
// bloom: only emissive parts (screens, LEDs, hologram) are bright enough to glow
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.7,.45,.9);composer.addPass(bloom);composer.addPass(new OutputPass());

// lights (exhibition hall: soft sky + overhead key)
scene.add(new THREE.HemisphereLight(0xf2f4ff,0x55504a,1.1));
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(-5,11,7); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30}); key.shadow.bias=-0.0004;
scene.add(key);
const fill=new THREE.DirectionalLight(0xcfe0ff,0.5); fill.position.set(6,6,-5); scene.add(fill);

// plan(mm) -> world(m): x right, z toward front A
const W=(x,y)=>[(x-3000)/1000,(y-3000)/1000];
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:0,...o});
const mat={
  wall:M(0x8a8d93,{roughness:.85}), stand:new THREE.MeshPhysicalMaterial({color:0xd4d6da,roughness:.3,clearcoat:1,clearcoatRoughness:.15}),
  led:M(0x000000,{emissive:0x38c8ff,emissiveIntensity:4}), ledFloor:M(0x000000,{emissive:0x3f8fe0,emissiveIntensity:3}), tvBody:M(0x0d0e10,{roughness:.4}),
  carpet:M(0x3d3f44,{roughness:1}), floor:M(0x8d8f93,{roughness:.95}), white:M(0xf1f1ef), grey:M(0x5e6168),
  green:M(0x6a9a3a), red:M(0xc0392b), metal:M(0xb9bec6,{metalness:.6,roughness:.35}), door:M(0x2b2d31,{roughness:.6}),
  blue:M(0x4fa3d9), logo:M(0xf2a48f,{roughness:1})
};
function mesh(g,m,cast=true){const o=new THREE.Mesh(g,m);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o;}
function box(x1,y1,x2,y2,z0,h,m){const [a,b]=W(x1,y1),[c,d]=W(x2,y2);const o=mesh(new THREE.BoxGeometry(c-a,h,d-b),m);o.position.set((a+c)/2,z0+h/2,(b+d)/2);return o;}
function prism(pts,z0,h,m){const s=new THREE.Shape();pts.forEach((p,i)=>{const [X,Z]=W(...p);i?s.lineTo(X,-Z):s.moveTo(X,-Z);});
  const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false});g.rotateX(-Math.PI/2);g.translate(0,z0,0);return mesh(g,m);}
function bandPts(p1,p2,th,off=0){const [x1,y1]=p1,[x2,y2]=p2,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,nx=uy,ny=-ux,o1=off-th/2,o2=off+th/2;
  return {pts:[[x1+nx*o1,y1+ny*o1],[x2+nx*o1,y2+ny*o1],[x2+nx*o2,y2+ny*o2],[x1+nx*o2,y1+ny*o2]],n:[nx,ny],u:[ux,uy]};}
function band(p1,p2,th,off,z0,h,m){const b=bandPts(p1,p2,th,off);prism(b.pts,z0,h,m);return b;}
// language: English by default, Japanese via the toggle (or ?lang=ja); 3D label text is [ja, en] or a neutral string
let lang='en';
try{lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('booth-lang')||'en';}catch(e){}
if(lang!=='ja')lang='en';
const tr=v=>Array.isArray(v)?v[lang==='ja'?0:1]:v;
const i18nLabels=[];
function label(text,x,y,h,cls=''){const d=document.createElement('div');d.className='lbl '+cls;d.textContent=tr(text);if(Array.isArray(text))i18nLabels.push([d,text]);const o=new CSS2DObject(d);const [X,Z]=W(x,y);o.position.set(X,h,Z);scene.add(o);return o;}

function screenTex(title,sub,hue){const c=document.createElement('canvas');c.width=640;c.height=360;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,640,360);gr.addColorStop(0,`hsl(${hue},70%,28%)`);gr.addColorStop(1,`hsl(${hue+30},80%,55%)`);g.fillStyle=gr;g.fillRect(0,0,640,360);
  g.strokeStyle='rgba(255,255,255,.15)';for(let i=0;i<14;i++){g.beginPath();g.moveTo(0,40+i*24);g.bezierCurveTo(200,i*20,420,360-i*18,640,60+i*20);g.stroke();}
  g.fillStyle='#fff';g.font='900 54px "Noto Sans JP",sans-serif';g.textAlign='center';g.fillText(title,320,190);
  if(sub){g.font='700 26px "Noto Sans JP",sans-serif';g.fillStyle='rgba(255,255,255,.85)';g.fillText(sub,320,240);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
// TV: centre point (plan), outward normal (plan), size in m, centre height
function tv(cx,cy,nx,ny,w,h,ch,tex,face=0){const [X,Z]=W(cx,cy);const ang=Math.atan2(nx,ny);const grp=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(w+0.03,h+0.03,0.05),mat.tvBody);body.castShadow=true;grp.add(body);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.75,roughness:.3}));scr.position.z=0.026;grp.add(scr);
  grp.position.set(X+nx*((face+25)/1000),ch,Z+ny*((face+25)/1000));grp.rotation.y=ang;scene.add(grp);return grp;}
// laptop on a stand: centre point (plan), facing direction (plan), table height, screen texture
function laptop(cx,cy,nx,ny,h,tex){const [X,Z]=W(cx,cy);const g=new THREE.Group();g.position.set(X,h,Z);g.rotation.y=Math.atan2(nx,ny);scene.add(g);
  const al=M(0x9aa0a8,{metalness:.5,roughness:.35});
  const kb=new THREE.Mesh(new THREE.BoxGeometry(.34,.02,.24),al);kb.position.y=.01;kb.castShadow=true;g.add(kb);
  const lid=new THREE.Group();lid.position.set(0,.02,-.12);lid.rotation.x=-.25;g.add(lid);
  const sh=new THREE.Mesh(new THREE.BoxGeometry(.34,.22,.012),al);sh.position.y=.11;sh.castShadow=true;lid.add(sh);
  const sc=new THREE.Mesh(new THREE.PlaneGeometry(.31,.2),new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.8}));sc.position.set(0,.11,.007);lid.add(sc);
  return g;}
// iPad on a desk holder: centre point (plan), facing direction (plan), table height, screen texture
function ipad(cx,cy,nx,ny,h,tex){const [X,Z]=W(cx,cy);const g=new THREE.Group();g.position.set(X,h,Z);g.rotation.y=Math.atan2(nx,ny);scene.add(g);
  const al=M(0x8d9198,{metalness:.5,roughness:.35});
  const base=new THREE.Mesh(new THREE.BoxGeometry(.12,.012,.1),al);base.position.y=.006;base.castShadow=true;g.add(base);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.03,.09,.012),al);arm.position.set(0,.05,-.03);arm.rotation.x=-.35;g.add(arm);
  const tab=new THREE.Group();tab.position.set(0,.13,-.02);tab.rotation.x=-.35;g.add(tab);
  const body=new THREE.Mesh(new THREE.BoxGeometry(.25,.175,.008),M(0x1a1b1e,{roughness:.3}));body.castShadow=true;tab.add(body);
  const sc=new THREE.Mesh(new THREE.PlaneGeometry(.232,.158),new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.8}));sc.position.z=.0045;tab.add(sc);
  return g;}
const IN={32:[.715,.402],43:[.952,.535],50:[1.107,.623],65:[1.439,.809],85:[1.882,1.059]};

// hall floor + carpet
const fl=mesh(new THREE.PlaneGeometry(60,60),mat.floor,false);fl.rotation.x=-Math.PI/2;fl.position.y=-0.002;
box(0,0,6000,6000,0,0.012,mat.carpet);
// LED line around the carpet edge
[[0,0,6000,25],[0,5975,6000,6000],[0,25,25,5975],[5975,25,6000,5975]].forEach(r=>box(...r,0.012,0.006,mat.ledFloor));

const H=2.7;
// STOCK
[[3000,0,3300,100],[4100,0,6000,100],[3000,100,3100,1500],[3100,1400,5900,1500],[5900,100,6000,1500]].forEach(r=>box(...r,0,H,mat.wall));
box(3300,0,4100,100,2.05,H-2.05,mat.wall);
box(3320,30,4080,70,0,2.03,mat.door);
{const [X,Z]=W(3950,-10);const k=mesh(new THREE.CylinderGeometry(.015,.015,.14,12),mat.metal);k.rotation.z=Math.PI/2;k.position.set(X,1.0,Z);}
label('STOCK 3000×1500',4500,750,2.95);
label(['扉 W800（通路側）','Door W800 (aisle side)'],3700,0,2.2);
tv(3000,750,-1,0,...IN[32],1.5,screenTex('Intro Video','32"',210));
label(['紹介動画 32インチTV','Intro video 32" TV'],3000,750,2.1);
// rally graphic on stock right face
{const c=document.createElement('canvas');c.width=512;c.height=768;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,768);gr.addColorStop(0,'#0f1c3a');gr.addColorStop(1,'#09090c');g.fillStyle=gr;g.fillRect(0,0,512,768);
  g.strokeStyle='#e63946';g.lineWidth=10;for(let i=0;i<4;i++){g.beginPath();g.moveTo(-40,520+i*40);g.lineTo(560,380+i*40);g.stroke();}
  g.fillStyle='#fff';g.textAlign='center';g.font='900 66px "Noto Sans JP",sans-serif';g.fillText('RALLY',256,250);g.font='700 30px "Noto Sans JP",sans-serif';g.fillText('Rally graphic',256,310);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const p=mesh(new THREE.PlaneGeometry(1.4,2.5),new THREE.MeshStandardMaterial({map:t,roughness:.8}),false);
  const [X,Z]=W(6002,750);p.position.set(X,1.3,Z);p.rotation.y=Math.PI/2;}
label(['d ラリー','d Rally graphic'],6000,750,2.95);

// F8VPS diagonal wall + light grey stand + 50" (stand side) + 65" (hologram side)
const fA=[180,170],fB=[1750,1600];
const fw=band(fA,fB,370,0,0,H,mat.wall);

function updateOcclusion(){occl.forEach(o=>{o.getWorldPosition(_p);_d.subVectors(_p,camera.position);const dist=_d.length();

let frame=0;
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{if(anim)anim();controls.update();
  const t=clock.getElapsedTime();holoCore.rotation.y=t*.8;holoCore.rotation.x=t*.3;holoCore.position.y=1.565+Math.sin(t*1.5)*.04;

  composer.render();labelR.render(scene,camera);});
